<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Usuários</title>
</head>
<body>
<main>
    <div class="card">
        <section class="card-texts">
            <h2>Usuários Cadastrados:</h2>
            
            <!-- Busca / Filtro por estado -->
            <div class="busca-container">
                <div class="search-box">
                    <input type="text" id="input-estado" placeholder="Filtrar por Estado (ex: Ceará)...">
                </div>
                <div class="btn-buscar">
                    <button type="button" id="btn-buscar">Buscar</button>
                </div>
                <div class="btn-mostrar">
                    <button type="button" id="btn-mostrar">Mostrar Todos</button>
                </div>
            </div>

            <!-- Lista de Usuários do Backend -->
            <ul id="usuarios_cadastrados"></ul>

            <h2>Entre para nossa Comunidade</h2>
            
            <!-- Formulário de Cadastro -->
            <form id="form-cadastro">
                <div class="field-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" class="text-box" required>
                </div>

                <div class="field-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" class="text-box" required>
                </div>

                <div class="field-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" class="text-box" required>
                </div>

                <div class="field-group">
                    <label for="estado">Estado:</label>
                    <input type="text" id="estado" class="text-box" required>
                </div>

                <button type="submit" id="botao">Finalizar Cadastro</button>
            </form>
        </section>
    </div>
</main>

<script src="Catalogo_front.js"></script>
</body>
</html>
